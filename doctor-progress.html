<body class="fl-app">
<div class="fl-sig">WE ARE PEOPLE DEALING WITH <b>FUNCTION</b></div>
<header class="site-header">
  <div class="logo"><img class="logo-img" src="icons/logo.png" alt="Physio Motion" onerror="this.style.display='none'"><span style="display:none">📈</span> Patient Reports</div>
  <div class="header-actions">
    <button class="btn btn-header" onclick="goProfile()">👤 Profile</button>
    <button class="btn btn-header" onclick="window.location.href='chat.html'">💬 Chat</button>
    <button class="btn btn-header" onclick="logout()">🚪 Logout</button>
  </div>
</header>

<div class="fl-subhero fl-console">
  <div class="fl-subhero-inner">
    <div class="fl-kicker" style="margin-bottom:10px;">Records module</div>
    <h1 class="fl-subtitle">📈 Patient Reports</h1>
    <p class="fl-subdesc">Monitor completion rates and patient progress</p>
  </div>
</div>

<div class="page-container">
  <button class="btn-back" onclick="window.location.href='plans.html'">← Plans</button>

  <div class="stats-grid">
    <div class="stat-card"><h3 id="statPatients">0</h3><p>Total Patients</p></div>
    <div class="stat-card"><h3 id="statAssignments">0</h3><p>Total Assignments</p></div>
    <div class="stat-card"><h3 id="statAvg">0%</h3><p>Avg Completion</p></div>
    <div class="stat-card success"><h3 id="statFull">0</h3><p>Fully Completed</p></div>
  </div>

  <div class="filter-row">
    <input type="text" id="searchInput" placeholder="Search patient name or email…" oninput="filterPatients()">
    <select id="statusFilter" onchange="filterPatients()">
      <option value="all">All Patients</option>
      <option value="excellent">Excellent (&gt;80%)</option>
      <option value="good">Good (50–80%)</option>
      <option value="low">Needs Work (&lt;50%)</option>
    </select>
  </div>

  <div id="patientsContainer"></div>
</div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

    } catch(e) {

      window.FIREBASE_ENABLED = false;
    }

<script src="js/utils.js"></script>
