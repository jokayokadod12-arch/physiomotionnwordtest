<script>
(function(){
  const pageKey = 'physio_mute_page_progress.html'.replace('.html','');
  const user = JSON.parse(localStorage.getItem('currentUser')||'null');
  if(!user) return;
  const muteKey = 'physio_page_muted_'+user.email;
  const muted = JSON.parse(localStorage.getItem(muteKey)||'[]');
  const btn = document.getElementById('mutePageBtn');
  if(btn){ btn.textContent = muted.includes(pageKey)?'🔕':'🔔'; btn.title = muted.includes(pageKey)?'Unmute notifications':'Mute notifications'; }
  window.togglePageMute = function(){
    const m2 = JSON.parse(localStorage.getItem(muteKey)||'[]');
    const i = m2.indexOf(pageKey);
    if(i===-1) m2.push(pageKey); else m2.splice(i,1);
    localStorage.setItem(muteKey,JSON.stringify(m2));
    if(btn){ btn.textContent=m2.includes(pageKey)?'🔕':'🔔'; btn.title=m2.includes(pageKey)?'Unmute notifications':'Mute notifications'; }
  };
})();
</script>
