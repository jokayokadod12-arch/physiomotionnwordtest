<body class="fl-app">
<div class="fl-sig">WE ARE PEOPLE DEALING WITH <b>FUNCTION</b></div>

<header class="site-header">
  <div class="logo"><img class="logo-img" src="icons/logo.png" alt="Physio Motion" onerror="this.style.display='none'"><span style="display:none">🏋️</span> Therapeutic Exercises</div>
  <div class="header-actions">
    <button class="btn btn-header" onclick="goProfile()">👤 Profile</button>
    <button class="btn btn-header" onclick="logout()">🚪 Logout</button>
  </div>
</header>

<div class="page-container">
  <button class="btn-back" onclick="window.location.href='therapeutic-exercises.html'">← Back to Departments</button>

  <!-- Success alert -->
  <div class="alert alert-success" id="successMsg"></div>

  <!-- Doctor assign panel (hidden for patients) -->
  <div class="assign-panel" id="doctorPanel" style="display:none;">
    <h3>📋 Assign Exercises to Patient</h3>

    <div class="search-wrap" id="searchWrap">
      <input type="text" id="searchInput" placeholder="Type patient name or email to search…" oninput="searchPatients()" autocomplete="off">
      <div class="patient-dropdown" id="patientDropdown"></div>
    </div>

    <div class="selected-patient" id="selectedPatientBox">
      <div>
        <div class="sp-label">Selected Patient</div>
        <div class="sp-name" id="spName"></div>
      </div>
      <button class="btn-change" onclick="changePatient()">Change</button>
    </div>

    <div class="note-area">
      <label>📝 Doctor's Note / Instructions for Patient:</label>
      <textarea id="doctorNote" placeholder="Write instructions, notes or a message for the patient…"></textarea>
    </div>

    <div class="assign-bottom">
      <span class="sel-count" id="selCount">Selected: 0 exercises</span>
      <button class="btn btn-success" id="sendBtn" onclick="sendExercises()" disabled>
        📤 Send Exercises to Patient
      </button>
    </div>
  </div>

  <!-- Department header -->
  <div class="dept-header">
    <div class="dh-icon" id="deptIcon">🏃</div>
    <div>
      <h2 id="deptName">Department</h2>
      <p id="deptDesc">Description</p>
    </div>
  </div>

  <!-- Videos -->
  <div class="videos-grid" id="videosGrid"></div>
</div>

<!-- Video modal -->
<div class="vid-modal" id="videoModal" onclick="handleModalClick(event)">
  <div class="vid-modal-inner">
    <button class="modal-close" onclick="closeVideo()" title="Close">×</button>
    <div class="vid-ratio-wrap" id="vidRatioWrap">
      <video id="videoPlayer" controls playsinline style="display:none;"></video>
    </div>
    <div class="vid-modal-title" id="videoTitle"></div>
    <div class="vid-modal-actions">
      <a id="vidYtLink" href="#" target="_blank" rel="noopener" class="vid-btn-yt">
        ▶ Open in YouTube
      </a>
    </div>
  </div>
</div>
