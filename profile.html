  <style>
    .section-divider {
      font-family:'Playfair Display',monospace; font-size:10px; font-weight:700;
      letter-spacing:2px; text-transform:uppercase; color:rgba(90,122,98,.5);
      margin:22px 0 12px; display:flex; align-items:center; gap:10px;
    }
    .section-divider::after { content:''; flex:1; height:1px; background:linear-gradient(90deg,rgba(90,122,98,.2),transparent); }
    .form-select {
      width:100%; background:rgba(250,247,242,.7); border:1px solid rgba(90,122,98,.2);
      border-radius:10px; color:#2C2C2C; font-family:'DM Sans',sans-serif;
      font-size:15px; padding:12px 14px; outline:none; transition:border-color .2s;
    }
    .form-select:focus { border-color:rgba(90,122,98,.5); }
    .form-select option { background:#FAF7F2; }
    .specialty-badge {
      display:inline-flex; align-items:center; gap:6px; margin-top:8px;
      padding:4px 12px; border-radius:20px; font-size:11px; font-weight:600;
      background:rgba(90,122,98,.1); border:1px solid rgba(90,122,98,.2); color:#7A9E82;
    }
    .case-stats-row { display:flex; gap:10px; margin-top:8px; }
    .case-stat-box {
      flex:1; text-align:center; padding:14px 10px; border-radius:14px;
      background:rgba(90,122,98,.08); border:1px solid rgba(90,122,98,.18);
    }
    .case-stat-n { display:block; font-family:'Playfair Display',serif; font-size:19px; font-weight:700; color:#2D4A35; }
    .case-stat-l { display:block; font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; color:#8A8A8A; margin-top:4px; }
  </style>
</head>
<body class="fl-app">
<div class="fl-sig">WE ARE PEOPLE DEALING WITH <b>FUNCTION</b></div>
<div class="grid-bg" aria-hidden="true"></div>
<header class="site-header">
  <div class="logo"><img class="logo-img" src="icons/logo.png" alt="Physio Motion" onerror="this.style.display='none'"><span style="display:none">👤</span> My Profile</div>
  <div class="header-actions">
    <button class="btn btn-header" onclick="goHome()">🏠 Dashboard</button>
    <button class="btn btn-header" onclick="logout()">🚪 Logout</button>
  </div>
</header>

<div class="profile-main">
  <div class="profile-card">
    <div class="page-title" style="margin-bottom:20px;">My Profile</div>
    <div class="avatar" id="avatar">?</div>
    <div class="info-strip">
      <p><strong>Role:</strong> <span id="displayRole">—</span></p>
      <p><strong>Email:</strong> <span id="displayEmail">—</span></p>
    </div>

    <!-- Common fields -->
    <div class="section-divider">Basic Info</div>
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="nameInput" placeholder="Your full name">
    </div>
    <div class="form-group">
      <label>Phone</label>
      <input type="tel" id="phoneInput" placeholder="Phone number">
    </div>
    <div class="form-group">
      <label>Bio / About</label>
      <textarea id="bioInput" rows="3" placeholder="Tell us about yourself…"></textarea>
    </div>

    <!-- Doctor-only fields -->
    <div id="doctorFields" style="display:none;">
      <div class="section-divider">Professional Info</div>
      <div class="form-group">
        <label>Specialty</label>
        <select class="form-select" id="specialtySelect"></select>
      </div>
      <div class="form-group">
        <label>Years of Experience</label>
        <input type="number" id="yearsInput" placeholder="e.g. 8" min="0" max="60">
      </div>
      <div class="section-divider">Clinic / Workplace</div>
      <div class="form-group">
        <label>Clinic / Hospital Name</label>
        <input type="text" id="clinicInput" placeholder="e.g. Cairo Physiotherapy Center">
      </div>
      <div class="form-group">
        <label>Address / Location</label>
        <input type="text" id="addressInput" placeholder="e.g. 5 Tahrir Square, Cairo">
      </div>
    </div>

    <!-- Student-only fields -->
    <div id="studentFields" style="display:none;">
      <div class="section-divider">Student Info</div>
      <div class="form-group">
        <label>University / College</label>
        <input type="text" id="universityInput" placeholder="e.g. Cairo University — Faculty of PT">
      </div>
      <div class="form-group">
        <label>Year of Study</label>
        <select class="form-select" id="yearStudyInput">
          <option value="">— Select Year —</option>
          <option value="1">Year 1</option>
          <option value="2">Year 2</option>
          <option value="3">Year 3</option>
          <option value="4">Year 4</option>
          <option value="5">Year 5 / Final Year</option>
          <option value="intern">Internship</option>
        </select>
      </div>

      <div class="section-divider">🩺 Physio Cases Progress</div>
      <div class="case-stats-row" id="caseStatsRow">
        <div class="case-stat-box"><span class="case-stat-n" id="csScore">—</span><span class="case-stat-l">Total Score</span></div>
        <div class="case-stat-box"><span class="case-stat-n" id="csDone">—</span><span class="case-stat-l">Cases Completed</span></div>
        <div class="case-stat-box"><span class="case-stat-n" id="csRank">—</span><span class="case-stat-l">Leaderboard Rank</span></div>
      </div>
      <button class="btn btn-secondary" style="width:100%;margin-top:10px;" onclick="window.location.href='physio-cases.html'">🩺 Go to Physio Cases</button>
    </div>

    <div class="profile-actions">
      <button class="btn btn-primary" onclick="saveProfile()">💾 Save Changes</button>
      <button class="btn btn-secondary" onclick="goHome()">← Back</button>
      <button class="btn btn-danger" onclick="logout()">🚪 Logout</button>
    </div>
  </div>
</div>

<script>
(async function loadCaseStatsForStudent() {
  const u = getCurrentUser();
  if (!u || u.role !== 'student' || !window.FIREBASE_ENABLED) return;
  try {
    const data = await dbGetCaseScores(u.email);
    document.getElementById('csScore').textContent = data ? (data.totalScore || 0) : 0;
    document.getElementById('csDone').textContent = (data ? (data.casesCompleted || 0) : 0) + ' / ' + (typeof PHYSIO_CASES !== 'undefined' ? PHYSIO_CASES.length : '—');
    const board = await dbGetCaseLeaderboard(500);
    const idx = board.findIndex(b => b.email === u.email);
    const total = data ? (data.totalScore || 0) : 0;
    document.getElementById('csRank').textContent = (idx > -1 && total > 0) ? ('#' + (idx + 1)) : '—';
  } catch (e) {
    document.getElementById('csScore').textContent = '0';
    document.getElementById('csDone').textContent = '0';
  }
})();
</script>
