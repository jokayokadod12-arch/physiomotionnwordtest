<style>
body { display:flex; flex-direction:column; min-height:100vh; }

.lb-hero {
  position:relative; z-index:1;
  background: linear-gradient(135deg, var(--forest-deep) 0%, var(--forest) 55%, var(--sage) 100%);
  padding: 32px 24px 46px; overflow:hidden; text-align:center;
}
.lb-hero::before { content:''; position:absolute; inset:0; pointer-events:none;
  background: radial-gradient(ellipse 70% 80% at 15% 30%, rgba(90,122,98,.3) 0%, transparent 60%),
              radial-gradient(ellipse 55% 65% at 90% 10%, rgba(184,148,63,.18) 0%, transparent 55%); }
.lb-hero::after { content:''; position:absolute; bottom:0; left:0; right:0; height:4px;
  background: linear-gradient(90deg, transparent, var(--sage-pale), var(--gold-light), var(--sage-pale), transparent); }
.lb-hero-inner { position:relative; z-index:1; max-width:640px; margin:0 auto; }
.lb-badge { display:inline-flex; align-items:center; gap:7px; padding:5px 14px; border-radius:100px;
  background:rgba(250,247,242,.1); border:1px solid rgba(250,247,242,.2); font-size:11px; font-weight:700;
  letter-spacing:1.5px; text-transform:uppercase; color:rgba(250,247,242,.7); margin-bottom:12px; }
.lb-title { font-family:'Playfair Display', serif; font-size:clamp(24px,4.5vw,34px); font-weight:700; color:#FAF7F2; margin-bottom:6px; }
.lb-sub { font-size:13px; color:rgba(250,247,242,.55); }

.lb-main { flex:1; max-width:760px; margin:-26px auto 0; width:100%; padding:0 20px 80px; position:relative; z-index:2; }

/* podium */
.lb-podium { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:22px; align-items:end; }
.lb-p-card { background:var(--bg-card); border:1px solid var(--border); border-radius:18px; padding:16px 10px 14px; text-align:center; box-shadow:var(--shadow); position:relative; }
.lb-p-card.gold { order:2; padding-top:22px; border-color:rgba(184,148,63,.4); }
.lb-p-card.silver { order:1; }
.lb-p-card.bronze { order:3; }
.lb-p-medal { font-size:26px; margin-bottom:6px; }
.lb-p-avatar { width:44px; height:44px; border-radius:12px; background:var(--bg-warm); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:20px; margin:0 auto 8px; }
.lb-p-name { font-family:'Playfair Display', serif; font-size:12.5px; font-weight:700; color:var(--forest); line-height:1.3; }
.lb-p-uni { font-size:10px; color:var(--muted); margin-top:2px; }
.lb-p-score { font-family:'Playfair Display', serif; font-size:18px; font-weight:700; color:var(--gold); margin-top:8px; }
@media(max-width:480px){ .lb-podium{ grid-template-columns:1fr 1fr 1fr; gap:6px; } .lb-p-card{ padding:12px 6px 10px; } }

.lb-list { background:var(--bg-card); border:1px solid var(--border); border-radius:18px; overflow:hidden; box-shadow:var(--shadow-sm); }
.lb-row { display:flex; align-items:center; gap:12px; padding:13px 16px; border-bottom:1px solid var(--border); transition:.2s; }
.lb-row:last-child { border-bottom:none; }
.lb-row.me { background:var(--sage-dim); }
.lb-rank { width:26px; text-align:center; font-family:'Playfair Display', serif; font-weight:700; font-size:13px; color:var(--muted); flex-shrink:0; }
.lb-avatar { width:36px; height:36px; border-radius:10px; background:var(--bg-warm); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
.lb-name-wrap { flex:1; min-width:0; }
.lb-name { font-size:13px; font-weight:700; color:var(--forest); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.lb-uni { font-size:10.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.lb-cases { font-size:10.5px; color:var(--muted); flex-shrink:0; margin-right:6px; }
.lb-score { font-family:'Playfair Display', serif; font-weight:700; font-size:14px; color:var(--gold); flex-shrink:0; }
.lb-you-tag { font-size:9px; font-weight:700; background:var(--sage); color:#fff; padding:2px 7px; border-radius:100px; margin-left:6px; }

.lb-empty { text-align:center; padding:60px 20px; color:var(--muted); font-size:13px; }
</style>
</head>
<body class="fl-app">
<div class="fl-sig">WE ARE PEOPLE DEALING WITH <b>FUNCTION</b></div>

<header class="site-header">
  <div class="logo"><img class="logo-img" src="icons/logo.png" alt="Physio Motion" onerror="this.style.display='none'"> Physio Motion</div>
  <div class="header-actions">
    <button class="btn btn-header" onclick="window.location.href='physio-cases.html'">🩺 Cases</button>
    <button class="btn btn-header" onclick="goHome()">🏠 Dashboard</button>
  </div>
</header>

<div class="lb-hero">
  <div class="lb-hero-inner">
    <div class="lb-badge"><span>🏆</span> Leaderboard</div>
    <div class="lb-title">Top Case Solvers</div>
    <div class="lb-sub">Ranked by total points earned across all Physio Cases — keep solving to climb up!</div>
  </div>
</div>

<main class="lb-main">
  <div id="podiumWrap"></div>
  <div class="lb-list" id="listWrap"></div>
</main>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script>
try {
  if (!firebase.apps.length) firebase.initializeApp({
    apiKey:"AIzaSyCzK4OGhLBgmIKktawOm44zd9KyhHlaITE",
    authDomain:"physiowork-8976f.firebaseapp.com",
    projectId:"physiowork-8976f",
    storageBucket:"physiowork-8976f.firebasestorage.app",
    messagingSenderId:"789519816056",
    appId:"1:789519816056:web:c2c8d82c83f8149fd1a48d"
  });
  window._fbDb = firebase.firestore();
  window._fbStorage = firebase.storage();
  window.FIREBASE_ENABLED = true;

<script src="js/utils.js"></script>
<script src="js/db.js"></script>
<script src="js/pwa.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const user = requireAuth(['doctor', 'student']);
  if (!user) return;

  let board = [];
  try { board = await dbGetCaseLeaderboard(200); } catch (e) { board = []; }
  board = board.filter(b => (b.totalScore || 0) > 0);

  if (!board.length) {
    document.getElementById('listWrap').innerHTML = '<div class="lb-empty">🌱 No scores yet — be the first to solve a Physio Case!</div>';
    return;
  }

  const top3 = board.slice(0, 3);
  const rest = board.slice(3);
  const medalClass = ['gold', 'silver', 'bronze'];
  const medalIcon = ['🥇', '🥈', '🥉'];

  const podium = document.getElementById('podiumWrap');
  if (top3.length) {
    podium.innerHTML = `<div class="lb-podium">${
      top3.map((b, i) => `
        <div class="lb-p-card ${medalClass[i]}">
          <div class="lb-p-medal">${medalIcon[i]}</div>
          <div class="lb-p-avatar">${b.avatar || '🎓'}</div>
          <div class="lb-p-name">${escapeHtml(b.name || b.email)}</div>
          <div class="lb-p-uni">${escapeHtml(b.university || '')}</div>
          <div class="lb-p-score">${b.totalScore} pts</div>
        </div>`).join('')
    }</div>`;
  }

  const list = document.getElementById('listWrap');
  list.innerHTML = '';
  board.forEach((b, i) => {
    const row = document.createElement('div');
    row.className = 'lb-row' + (b.email === user.email ? ' me' : '');
    row.innerHTML = `
      <div class="lb-rank">#${i + 1}</div>
      <div class="lb-avatar">${b.avatar || '🎓'}</div>
      <div class="lb-name-wrap">
        <div class="lb-name">${escapeHtml(b.name || b.email)}${b.email === user.email ? '<span class="lb-you-tag">YOU</span>' : ''}</div>
        <div class="lb-uni">${escapeHtml(b.university || '—')}</div>
      </div>
      <div class="lb-cases">${b.casesCompleted || 0} case${(b.casesCompleted||0)===1?'':'s'}</div>
      <div class="lb-score">${b.totalScore}</div>`;
    list.appendChild(row);
  });
});

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
}
</script>
</body>
</html>
