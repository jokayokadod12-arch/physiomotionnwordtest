<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png">
  <link rel="apple-touch-icon" sizes="144x144" href="icons/icon-144.png">
  <meta name="theme-color" content="#1D3028">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Physio Motion">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Student Chat — Physio Motion</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--dark:#FAF7F2;--dark2:#F5EFE4;--mid:#EDE3D4;--cyan:#7A9E82;--blue:#5A7A62;--text:#2C2C2C;--border:rgba(90,122,98,.14);--cream:#FAF7F2;--sage:#5A7A62;--forest:#2D4A35;--charcoal-mid:#4A4A4A;--muted:#8A8A8A;--text-primary:#2C2C2C;}
html,body{
  height:100%; height:100dvh;
  /* PWA fix: use small viewport height so keyboard doesn't push content */
  height:100svh;
  overflow:hidden;
  background:var(--cream);color:var(--text-primary);font-family:'DM Sans',sans-serif;
}
/* iOS safe area support */
/* Safe area for iOS home bar */
@supports(padding-bottom: env(safe-area-inset-bottom)){
  .input-bar{padding-bottom:calc(10px + env(safe-area-inset-bottom));}
}
/* PWA keyboard-aware input bar */
@supports(height: env(keyboard-inset-height)){
  .input-bar{
    padding-bottom:calc(10px + env(keyboard-inset-height, 0px));
    transition:padding-bottom .15s;
  }
}

/* NAV */
/* PWA layout: body is a flex column so chat-wrap fills remaining space */
body{display:flex;flex-direction:column;}
.top-nav{height:52px;background:rgba(250,247,242,.95);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 12px;gap:8px;flex-shrink:0;position:relative;z-index:10;overflow-x:auto;overflow-y:hidden;}
.nav-logo{font-family:'Playfair Display',monospace;font-size:12px;color:var(--cyan);letter-spacing:2px;flex:1;}
.nav-btn{background:rgba(90,122,98,.07);border:1px solid rgba(90,122,98,.18);color:var(--cyan);border-radius:7px;padding:6px 10px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:.18s;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:5px;flex-shrink:0;}
.nav-btn:hover{background:rgba(90,122,98,.15);}
.notif-wrap{position:relative;}
.notif-badge{position:absolute;top:-5px;right:-5px;background:#e91e63;color:#fff;border-radius:8px;font-size:9px;font-weight:700;padding:1px 4px;display:none;line-height:1.4;}

/* LAYOUT */
.chat-wrap{
  display:flex;
  /* Use flex growth instead of calc so keyboard doesn't break it */
  flex:1;
  min-height:0;
  overflow:hidden;
}

/* SIDEBAR */
.sidebar{width:270px;flex-shrink:0;background:rgba(250,247,242,.88);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;transition:.22s;}
@media(max-width:660px){
  .sidebar{position:absolute;left:-100vw;top:52px;bottom:0;z-index:20;transition:.22s;width:100vw;}
  .sidebar.open{left:0;}
}
.sb-header{padding:14px 14px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.sb-title{font-family:'Playfair Display',monospace;font-size:10px;letter-spacing:1.5px;color:rgba(90,122,98,.6);}
.sb-search{padding:8px 10px;border-bottom:1px solid rgba(90,122,98,.06);}
.sb-search input{width:100%;background:rgba(90,122,98,.05);border:1px solid rgba(90,122,98,.14);border-radius:7px;color:var(--text-primary);font-family:'DM Sans',sans-serif;font-size:13px;padding:7px 10px;outline:none;}
.sb-search input::placeholder{color:var(--muted);}
.conv-list{flex:1;overflow-y:auto;}
.conv-list::-webkit-scrollbar{width:3px;}
.conv-list::-webkit-scrollbar-thumb{background:rgba(90,122,98,.15);border-radius:3px;}
.conv-item{display:flex;align-items:center;gap:10px;padding:11px 13px;cursor:pointer;border-bottom:1px solid rgba(90,122,98,.05);transition:.15s;position:relative;}
@media(max-width:660px){.conv-item{padding:15px 14px;}}
.conv-item:hover{background:rgba(90,122,98,.06);}
.conv-item.active{background:rgba(90,122,98,.1);border-left:3px solid var(--cyan);}
.ci-avatar{width:38px;height:38px;border-radius:9px;background:linear-gradient(135deg,rgba(90,122,98,.18),rgba(45,74,53,.25));border:1px solid rgba(90,122,98,.22);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',monospace;font-size:12px;font-weight:700;color:var(--cyan);flex-shrink:0;}
.ci-info{flex:1;min-width:0;}
.ci-name{font-size:13px;font-weight:600;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ci-last{font-size:11px;color:var(--charcoal-mid);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
.ci-badge{background:#e91e63;color:#fff;border-radius:8px;font-size:9px;font-weight:700;padding:2px 5px;flex-shrink:0;}
.ci-del-btn{background:none;border:none;cursor:pointer;font-size:14px;color:var(--charcoal-mid);padding:4px 6px;border-radius:6px;transition:.15s;flex-shrink:0;opacity:0;}
.conv-item:hover .ci-del-btn{opacity:1;}
.conv-item:hover .ci-del-btn:hover{color:#ff6b6b;background:rgba(255,107,107,.1);}
@media(max-width:660px){.ci-del-btn{opacity:0.45;}}
.ch-del-btn{color:rgba(255,107,107,.6);border-color:rgba(255,107,107,.15);}
.ch-del-btn:hover{background:rgba(255,107,107,.12);color:#ff6b6b;}
.ci-muted{font-size:12px;opacity:.4;margin-left:2px;}
.sb-empty{padding:30px 16px;text-align:center;font-size:12px;color:var(--muted);}

/* MAIN CHAT */
.chat-main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;}

/* Empty state */
.chat-placeholder{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--charcoal-mid);gap:14px;}
.chat-placeholder span{font-size:52px;}
.chat-placeholder p{font-family:'Playfair Display',monospace;font-size:11px;letter-spacing:2px;}
.open-convs-btn{display:none;margin-top:8px;padding:12px 24px;background:rgba(90,122,98,.13);border:1px solid rgba(90,122,98,.35);color:var(--cyan);border-radius:11px;font-family:'Playfair Display',monospace;font-size:11px;letter-spacing:1px;cursor:pointer;transition:.18s;}
.open-convs-btn:hover{background:rgba(90,122,98,.22);}
@media(max-width:660px){.open-convs-btn{display:block;}}
.mob-menu-btn{display:none;}
@media(max-width:660px){.mob-menu-btn{display:inline-flex;}}

/* Active conv header */
.conv-header{background:rgba(250,247,242,.92);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0;display:none;}
.conv-header.show{display:flex;}
.ch-back{background:none;border:none;color:var(--cyan);font-size:20px;cursor:pointer;display:none;padding:0 4px;}
@media(max-width:660px){.ch-back{display:block;}}
.ch-avatar{width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,rgba(90,122,98,.18),rgba(45,74,53,.25));border:1px solid rgba(90,122,98,.22);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',monospace;font-size:12px;font-weight:700;color:var(--cyan);cursor:pointer;flex-shrink:0;}
.ch-info{flex:1;cursor:pointer;}
.ch-name{font-family:'Playfair Display',monospace;font-size:13px;font-weight:700;color:var(--forest);}
.ch-sub{font-size:11px;color:rgba(90,122,98,.55);margin-top:1px;}
.ch-actions{display:flex;gap:6px;}
.ch-btn{background:rgba(90,122,98,.07);border:1px solid rgba(90,122,98,.14);color:var(--cyan);border-radius:7px;padding:5px 9px;cursor:pointer;font-size:13px;transition:.15s;}
.ch-btn:hover{background:rgba(90,122,98,.16);}
.ch-btn.muted-btn{color:var(--muted);border-color:rgba(90,122,98,.08);}

/* Messages */
.messages-wrap{flex:1;overflow-y:auto;padding:16px 16px 10px;display:flex;flex-direction:column;gap:6px;}
.messages-wrap::-webkit-scrollbar{width:4px;}
.messages-wrap::-webkit-scrollbar-thumb{background:rgba(90,122,98,.15);border-radius:4px;}

.date-sep{text-align:center;font-size:10px;color:rgba(90,122,98,.35);letter-spacing:1px;font-family:'Playfair Display',monospace;padding:6px 0;}

.msg-row{display:flex;gap:8px;align-items:flex-end;max-width:75%;}
@media(max-width:660px){
  .msg-row{flex-direction:column;gap:2px;max-width:85%;}
  .chat-main{height:100%;display:flex;flex-direction:column;overflow:hidden;}
  .messages-wrap{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0;}
  .input-bar{width:100%;flex-shrink:0;}
  .msg-row.mine{align-items:flex-end;}
  .msg-row.theirs{align-items:flex-start;}}
.msg-row.mine{align-self:flex-end;flex-direction:row-reverse;}
.msg-row.theirs{align-self:flex-start;}

.msg-bubble{border-radius:14px;padding:9px 13px;position:relative;word-break:break-word;max-width:100%;}
.mine .msg-bubble{background:linear-gradient(135deg,#5A7A62,#0a4a9e);color:#fff;border-bottom-right-radius:3px;}
.theirs .msg-bubble{background:rgba(245,239,228,.95);border:1px solid rgba(90,122,98,.12);color:var(--text-primary);border-bottom-left-radius:3px;}

.msg-text{font-size:14px;line-height:1.55;white-space:pre-wrap;}
.msg-deleted{font-style:italic;font-size:13px;color:var(--muted);}
.msg-time{font-size:10px;color:var(--muted);margin-top:4px;text-align:right;}
.mine .msg-time{color:rgba(255,255,255,.38);}

/* Media messages */
.msg-img img{max-width:210px;border-radius:10px;cursor:pointer;display:block;}
.msg-vid video{max-width:210px;border-radius:10px;display:block;}
.msg-file-row{display:flex;align-items:center;gap:10px;padding:8px 10px;background:rgba(90,122,98,.07);border:1px solid rgba(90,122,98,.14);border-radius:9px;cursor:pointer;transition:.15s;}
.msg-file-row:hover{background:rgba(90,122,98,.14);}
.file-ico{font-size:22px;}
.file-nm{font-size:13px;color:var(--text-primary);font-weight:600;}
.file-sz{font-size:10px;color:rgba(90,122,98,.55);}

/* Delete action */
.msg-actions{display:none;position:absolute;top:-28px;right:0;background:rgba(250,247,242,.96);border:1px solid var(--border);border-radius:7px;padding:3px 5px;gap:2px;}
.msg-row:hover .msg-actions{display:flex;}
.theirs .msg-actions{right:auto;left:0;}
.del-btn{background:none;border:none;cursor:pointer;font-size:14px;color:var(--charcoal-mid);padding:2px 4px;transition:.15s;}
@media(max-width:660px){
  .msg-actions{display:flex;position:static;background:none;border:none;padding:0;margin-top:2px;}
  .mine .msg-actions{justify-content:flex-end;}
  .del-btn{font-size:13px;opacity:0.35;padding:1px 3px;}
}
.del-btn:hover{color:#ff6b6b;}

/* Input */
.input-bar{
  background:rgba(250,247,242,.92);
  border-top:1px solid var(--border);
  padding:10px 14px;
  display:flex;
  align-items:flex-end;
  gap:8px;
  flex-shrink:0;
  position:relative;
  z-index:10;
  /* Prevent keyboard from hiding this on PWA */
  position:sticky;
  bottom:0;
  left:0;
  right:0;
}
.attach-btn{background:none;border:none;color:rgba(90,122,98,.5);font-size:20px;cursor:pointer;padding:5px;transition:.15s;flex-shrink:0;}
.attach-btn:hover{color:var(--cyan);}
.msg-input{flex:1;background:rgba(245,239,228,.85);border:1px solid rgba(90,122,98,.2);border-radius:11px;color:var(--text-primary);font-family:'DM Sans',sans-serif;font-size:15px;padding:9px 13px;outline:none;resize:none;max-height:110px;min-height:40px;line-height:1.45;transition:border-color .18s;}
.msg-input:focus{border-color:rgba(90,122,98,.45);}
.msg-input::placeholder{color:var(--charcoal-mid);}
.send-btn{background:var(--sage);border:none;color:#fff;width:40px;height:40px;border-radius:9px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.18s;}
.send-btn:hover{background:#1a75ff;box-shadow:0 4px 14px rgba(90,122,98,.3);}

/* Attach menu */
.attach-menu{position:absolute;bottom:62px;left:14px;background:rgba(250,247,242,.98);border:1px solid var(--border);border-radius:11px;overflow:hidden;display:none;box-shadow:0 10px 30px rgba(0,0,0,.5);}
.attach-menu.show{display:block;}
.att-opt{display:flex;align-items:center;gap:10px;padding:11px 16px;cursor:pointer;font-size:13px;color:var(--text-primary);transition:.15s;}
.att-opt:hover{background:rgba(90,122,98,.1);}

/* Profile panel */
.prof-panel{width:260px;flex-shrink:0;background:rgba(250,247,242,.92);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;display:none;}
.prof-panel.open{display:flex;}
.pp-head{padding:18px 16px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.pp-close{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;}
.pp-body{padding:18px 16px;display:flex;flex-direction:column;gap:10px;}
.pp-avatar{width:64px;height:64px;border-radius:14px;background:linear-gradient(135deg,rgba(90,122,98,.18),rgba(45,74,53,.25));border:1px solid rgba(90,122,98,.22);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',monospace;font-size:20px;font-weight:700;color:var(--cyan);margin:0 auto;}
.pp-name{font-family:'Playfair Display',monospace;font-size:13px;color:var(--forest);text-align:center;}
.pp-role{font-size:11px;color:rgba(90,122,98,.55);text-align:center;letter-spacing:1px;}
.pp-row{font-size:12px;color:var(--charcoal-mid);display:flex;gap:8px;}
.pp-row strong{color:#2C2C2C;min-width:65px;}
.pp-mute-btn{padding:9px;background:rgba(255,152,0,.07);border:1px solid rgba(255,152,0,.2);color:#ff9800;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;transition:.15s;text-align:center;}
.pp-mute-btn:hover{background:rgba(255,152,0,.15);}
.pp-block-btn{padding:9px;background:rgba(200,74,74,.07);border:1px solid rgba(200,74,74,.22);color:#c84a4a;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;transition:.15s;text-align:center;}
.pp-block-btn:hover{background:rgba(200,74,74,.15);}
.pp-block-btn.is-blocked{background:#c84a4a;color:#fff;}

/* New chat button */
.new-chat-btn{margin:0 10px 8px;padding:9px;background:var(--sage);color:#fff;border:none;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:700;cursor:pointer;transition:.15s;}
.new-chat-btn:hover{background:var(--forest);}

/* Block banner in conversation */
.block-banner{padding:9px 16px;background:rgba(200,74,74,.08);border-bottom:1px solid rgba(200,74,74,.18);color:#c84a4a;font-size:12px;text-align:center;flex-shrink:0;}

/* Find student modal */
.fs-overlay{display:none;position:fixed;inset:0;z-index:400;align-items:center;justify-content:center;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);}
.fs-overlay.show{display:flex;}
.fs-box{background:#FAFAF7;border:1px solid rgba(90,122,98,.2);border-radius:18px;width:min(400px,92vw);max-height:72vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.25);}
.fs-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid rgba(90,122,98,.1);font-family:'Playfair Display',serif;font-size:14px;font-weight:700;color:#3D5A45;}
.fs-list{overflow-y:auto;flex:1;padding:6px 10px;}
.fs-item{display:flex;align-items:center;gap:10px;padding:10px 8px;cursor:pointer;border-radius:9px;transition:.15s;}
.fs-item:hover{background:rgba(90,122,98,.08);}
.fs-item .ci-avatar{margin:0;}
.fs-sub{font-size:11px;color:rgba(90,122,98,.55);}
.fs-blocked-tag{margin-left:auto;font-size:10px;color:#c84a4a;font-weight:700;}

/* Mentions rendered inside messages */
.mention{color:var(--forest);font-weight:700;cursor:pointer;background:rgba(184,148,63,.14);border-radius:4px;padding:0 3px;}
.mention:hover{text-decoration:underline;}
.msg-text a{color:inherit;text-decoration:underline;word-break:break-all;}

/* hidden file input */
#fileInput{display:none;}

/* overlay for mobile sidebar */
.sb-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:15;}
.sb-overlay.show{display:block;}

/* ── Notification popup panel ── */
.notif-popup {
  display: none; position: fixed; inset: 0; z-index: 400;
  align-items: center; justify-content: center;
  background: rgba(0,0,0,.55); backdrop-filter: blur(6px);
}
.notif-popup.show { display: flex; }
.notif-box {
  background: #FAFAF7; border: 1px solid rgba(90,122,98,.2);
  border-radius: 18px; width: min(380px, 92vw); max-height: 70vh;
  display: flex; flex-direction: column; overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,.25);
}
.notif-box-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 18px; border-bottom: 1px solid rgba(90,122,98,.1);
  font-family: 'Playfair Display', serif; font-size: 14px;
  font-weight: 700; color: #3D5A45;
}
.notif-box-head button {
  background: none; border: none; font-size: 18px; cursor: pointer;
  color: rgba(90,122,98,.5); padding: 2px 6px; border-radius: 6px;
  transition: .15s;
}
.notif-box-head button:hover { background: rgba(90,122,98,.1); }
.notif-list { overflow-y: auto; flex: 1; padding: 10px 12px; }
.np-item {
  position: relative; padding: 11px 36px 11px 14px;
  background: rgba(245,239,228,.7); border: 1px solid rgba(90,122,98,.1);
  border-radius: 10px; margin-bottom: 8px;
}
.np-title { font-size: 13px; font-weight: 700; color: #2C2C2C; margin-bottom: 3px; }
.np-body  { font-size: 12px; color: rgba(44,44,44,.65); line-height: 1.45; }
.np-del {
  position: absolute; top: 8px; right: 8px;
  background: none; border: none; color: rgba(90,122,98,.4);
  font-size: 13px; cursor: pointer; padding: 2px 5px;
  border-radius: 5px; transition: .15s;
}
.np-del:hover { background: rgba(255,82,82,.1); color: #ff6b6b; }

</style>
</head>
<body>

<div class="top-nav">
  <button class="nav-btn mob-menu-btn" id="mobMenuBtn" onclick="openSidebar()">☰ Chats</button>
  <div class="nav-logo">🎓 STUDENT CHAT</div>
  <div class="notif-wrap">
    <button class="nav-btn" onclick="goHome()">🏠 Home</button>
  </div>
  <div class="notif-wrap">
    <button class="nav-btn" id="notifBtn" onclick="openNotifs()">🔔 Notifications</button>
    <span class="notif-badge" id="notifBadge"></span>
  </div>
  <button class="nav-btn" onclick="logout()">🚪 Logout</button>
</div>

<div class="sb-overlay" id="sbOverlay" onclick="closeSidebar()"></div>

<div class="chat-wrap">

  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <div class="sb-header">
      <div class="sb-title">STUDENTS</div>
      <button class="ch-btn" onclick="closeSidebar()" style="display:none;" id="sbCloseBtn">✕</button>
    </div>
    <div class="sb-search">
      <input placeholder="Search conversations…" oninput="filterConvs(this.value)" id="convSearch">
    </div>
    <button class="new-chat-btn" onclick="openFindStudent()">🔍 Find a Student — New Chat</button>
    <div class="conv-list" id="convList">
      <div class="sb-empty">No conversations yet</div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="chat-main" id="chatMain">

    <!-- Placeholder -->
    <div class="chat-placeholder" id="chatPlaceholder">
      <span>💬</span>
      <p>SELECT A CONVERSATION</p>
      <button class="open-convs-btn" onclick="openSidebar()">📋 Open Conversations</button>
    </div>

    <!-- Active conversation -->
    <div class="conv-header" id="convHeader">
      <button class="ch-back" onclick="openSidebar()">‹</button>
      <div class="ch-avatar" id="chAvatar" onclick="toggleProfPanel()">?</div>
      <div class="ch-info" onclick="toggleProfPanel()">
        <div class="ch-name" id="chName">—</div>
        <div class="ch-sub" id="chSub">Tap for profile</div>
      </div>
      <div class="ch-actions">

<script>
'use strict';

// ─── State ───────────────────────────────────────────────
let ME = null;          // current user object
let ACTIVE_ID = null;   // active conversation id
let OTHER = null;       // other user object in active conv
let POLL = null;        // setInterval handle

// In-memory caches (populated from Firestore, refreshed on poll)
let _msgsCache  = {};   // chatId -> messages[]
let _convsCache = [];   // conversations[]
let _mutedCache = [];   // muted chatIds[]
let _blockedCache = []; // emails I've blocked
let _notifsCache= [];   // notification items[]
let _seenNotifIds = new Set(); // local dedupe for browser notifications
let _allStudents = [];  // all student accounts, for "Find a Student" search

// ─── Chat id: alphabetically sorted emails ───────────────
function chatId(a, b) { return [a, b].sort().join('||'); }

// ─── Firestore-backed helpers ─────────────────────────────

// Messages
function loadMsgs(id)    { return _msgsCache[id] || []; }
async function saveMsgs(id, msgs) {
  _msgsCache[id] = msgs;
  // Individual saves handled by appendMsg / deleteMsg via dbSaveMessage
}

// Conversations
function loadConvs()     { return _convsCache; }
async function saveConvs(convs) {
  _convsCache = convs;
  for (const c of convs) await dbSaveConv(ME.email, c);
}

// Muted
function getMuted()      { return _mutedCache; }
async function setMuted(m) {
  _mutedCache = m;
  await dbSaveMuted(ME.email, m);
}
function isMuted(id)     { return _mutedCache.includes(id); }

// Blocked
async function setBlocked(list) {
  _blockedCache = list;
  await dbSaveBlocked(ME.email, list);
}
function isBlockedByMe(email) { return _blockedCache.includes(email); }

// Notifications
function getNotifs(em)   { return em === ME.email ? _notifsCache : []; }
async function saveNotifs(em, notifs) {
  if (em === ME.email) _notifsCache = notifs;
}

// ─── Ensure conversation is in my list ───────────────────
async function ensureConv(otherEmail, otherName) {
  const id = chatId(ME.email, otherEmail);
  if (!_convsCache.find(c => c.id === id)) {
    const conv = { id, otherEmail, otherName: otherName || otherEmail, lastMsg: '', lastTime: Date.now() };
    _convsCache.push(conv);
    await dbSaveConv(ME.email, conv);
  }
}

// ─── Render conversation list ─────────────────────────────
function renderConvList(filter = '') {
  const convs = _convsCache.filter(c =>
    !filter || (c.otherName || c.otherEmail || '').toLowerCase().includes(filter.toLowerCase())
  );
  const list = document.getElementById('convList');
  if (!convs.length) {
    list.innerHTML = '<div class="sb-empty">No conversations yet.<br>Tap "Find a Student" to start.</div>';
    return;
  }
  list.innerHTML = convs
    .sort((a, b) => (b.lastTime || 0) - (a.lastTime || 0))
    .map(c => {
      const msgs   = loadMsgs(c.id);
      const last   = msgs[msgs.length - 1];
      const unread = msgs.filter(m => m.from !== ME.email && !m.read).length;
      const muted  = isMuted(c.id);
      const init   = initials(c.otherName || c.otherEmail);
      let lastTxt  = last
        ? (last.deleted ? '🚫 Deleted' : last.type === 'image' ? '🖼 Image' : last.type === 'video' ? '🎬 Video' : last.type === 'file' ? '📎 ' + (last.fileName || 'File') : (last.text || '').slice(0, 45))
        : 'No messages yet';
      return `<div class="conv-item ${ACTIVE_ID === c.id ? 'active' : ''}"
        onclick="openConv('${e(c.id)}','${e(c.otherEmail)}','${e(c.otherName || c.otherEmail)}')">
        <div class="ci-avatar">${init}</div>
        <div class="ci-info">
          <div class="ci-name">${e(c.otherName || c.otherEmail)}${muted ? '<span class="ci-muted">🔕</span>' : ''}</div>
          <div class="ci-last">${e(lastTxt)}</div>
        </div>
        ${unread > 0 ? `<span class="ci-badge">${unread}</span>` : ''}
        <button class="ci-del-btn" onclick="event.stopPropagation();deleteConv('${e(c.id)}')" title="Delete chat">🗑</button>
      </div>`;
    }).join('');
}

function filterConvs(q) { renderConvList(q); }

// ─── Open a conversation ──────────────────────────────────
async function openConv(id, otherEmail, otherName) {
  ACTIVE_ID = id;
  ensureConv(otherEmail, otherName);

  // Load other user profile
  OTHER = getAllUsers().find(u => u.email === otherEmail) || { email: otherEmail, name: otherName, role: '' };
  if (window.FIREBASE_ENABLED) {
    const fresh = await asyncGetUser(otherEmail).catch(() => null);
    if (fresh) OTHER = fresh;
  }

  // Mark all incoming as read
  markRead(id);

  // Show UI
  const name = OTHER.name || otherEmail;
  const init = initials(name);
  document.getElementById('chAvatar').textContent = init;
  document.getElementById('chName').textContent   = name;
  document.getElementById('chSub').textContent    = OTHER.profile?.university ? OTHER.profile.university : 'Tap for profile';
  document.getElementById('convHeader').classList.add('show');
  document.getElementById('messagesWrap').style.display = 'flex';
  document.getElementById('messagesWrap').style.flexDirection = 'column';
  document.getElementById('inputBar').style.display = 'flex';
  document.getElementById('chatPlaceholder').style.display = 'none';

  updateMuteBtn();
  await updateBlockUI();
  updateProfPanel();
  renderMessages();
  renderConvList();
  closeSidebar();
  scrollBottom();
}

// ─── Block state UI ────────────────────────────────────────
async function updateBlockUI() {
  const banner = document.getElementById('blockBanner');
  const inputBar = document.getElementById('inputBar');
  if (!OTHER) return;
  const iBlockedThem = isBlockedByMe(OTHER.email);
  const theyBlockedMe = await dbGetBlocked(OTHER.email).then(list => list.includes(ME.email)).catch(() => false);
  if (iBlockedThem) {
    banner.style.display = 'block';
    banner.textContent = '⛔ You blocked ' + (OTHER.name || OTHER.email) + '. Unblock from their profile to chat again.';
    inputBar.style.display = 'none';
  } else if (theyBlockedMe) {
    banner.style.display = 'block';
    banner.textContent = '⛔ You can\'t message this student right now.';
    inputBar.style.display = 'none';
  } else {
    banner.style.display = 'none';
    inputBar.style.display = 'flex';
  }
  const ppBtn = document.getElementById('ppBlockBtn');
  if (ppBtn) {
    ppBtn.textContent = iBlockedThem ? '✅ Unblock Student' : '⛔ Block Student';
    ppBtn.classList.toggle('is-blocked', iBlockedThem);
  }
}

async function toggleBlock() {
  if (!OTHER) return;
  const blocked = isBlockedByMe(OTHER.email);
  if (!blocked) {
    const ok = await customConfirm(`Block ${OTHER.name || OTHER.email}?\n\nThey won't be able to message you, and you won't be able to message them, until you unblock.`, {
      title: 'Block Student', icon: '⛔', confirmLabel: 'Block', danger: true
    });
    if (!ok) return;
  }
  const list = [..._blockedCache];
  const i = list.indexOf(OTHER.email);
  if (i === -1) list.push(OTHER.email); else list.splice(i, 1);
  await setBlocked(list);
  await updateBlockUI();
}

// ─── Find a Student (new chat) ──────────────────────────────
async function openFindStudent() {
  document.getElementById('fsOverlay').classList.add('show');
  document.getElementById('fsSearch').value = '';
  if (!_allStudents.length) {
    const all = await asyncGetAllUsers().catch(() => []);
    _allStudents = all.filter(u => u.role === 'student' && u.email !== ME.email);
  }
  renderFindStudent('');
}
function closeFindStudent() { document.getElementById('fsOverlay').classList.remove('show'); }
function renderFindStudent(q) {
  q = (q || '').toLowerCase().trim();
  const list = _allStudents.filter(u =>
    !q || (u.name || '').toLowerCase().includes(q) || (u.email || '').toLowerCase().includes(q)
  );
  const wrap = document.getElementById('fsList');
  if (!list.length) {
    wrap.innerHTML = '<div class="sb-empty">No students found</div>';
    return;
  }
  wrap.innerHTML = list.map(u => `
    <div class="fs-item" onclick="startChatWith('${e(u.email)}','${e(u.name || u.email)}')">
      <div class="ci-avatar">${initials(u.name || u.email)}</div>
      <div class="ci-info">
        <div class="ci-name">${e(u.name || u.email)}</div>
        <div class="fs-sub">${e(u.profile?.university || u.email)}</div>
      </div>
      ${isBlockedByMe(u.email) ? '<span class="fs-blocked-tag">Blocked</span>' : ''}
    </div>`).join('');
}
async function startChatWith(email, name) {
  closeFindStudent();
  await ensureConv(email, name);
  await openConv(chatId(ME.email, email), email, name);
}

// ─── Render messages ──────────────────────────────────────
function renderMessages() {
  if (!ACTIVE_ID) return;
  const msgs = loadMsgs(ACTIVE_ID);
  const wrap = document.getElementById('messagesWrap');
  if (!msgs.length) {
    wrap.innerHTML = '<div style="text-align:center;font-size:12px;color:var(--charcoal-mid);padding:30px 0;">No messages yet. Say hello! 👋</div>';
    return;
  }

  let html = '', lastDate = '';
  msgs.forEach(m => {
    const mine = m.from === ME.email;
    const d    = new Date(m.ts);
    const ds   = d.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
    if (ds !== lastDate) { html += `<div class="date-sep">${ds}</div>`; lastDate = ds; }
    const ts = d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });

    let body = '';
    if (m.deleted) {
      body = `<div class="msg-deleted">🚫 This message was deleted</div>`;
    } else if (m.type === 'image') {
      body = `<div class="msg-img"><img src="${m.data}" alt="img" onclick="lightbox('${m.data}')"></div>`;
    } else if (m.type === 'video') {
      body = `<div class="msg-vid"><video src="${m.data}" controls></video></div>`;
    } else if (m.type === 'file') {
      body = `<div class="msg-file-row" onclick="dl('${m.data}','${e(m.fileName||'file')}')">
        <span class="file-ico">📎</span>
        <div><div class="file-nm">${e(m.fileName||'File')}</div><div class="file-sz">${m.fileSize||''}</div></div>
        <span style="margin-left:auto;font-size:11px;color:rgba(90,122,98,.5);">↓</span>
      </div>`;
    } else {
      body = `<div class="msg-text">${linkify(e2(m.text || ''))}</div>`;
    }

    html += `<div class="msg-row ${mine ? 'mine' : 'theirs'}" id="msg-${m.id}">
      <div class="msg-bubble">
        ${mine && !m.deleted ? `<div class="msg-actions"><button class="del-btn" onclick="deleteMsg('${m.id}')" title="Delete">🗑</button></div>` : ''}
        ${body}
        <div class="msg-time">${ts}${mine ? ' ✓✓' : ''}</div>
      </div>
    </div>`;
  });

  wrap.innerHTML = html;
  scrollBottom();
}

function scrollBottom() {
  const w = document.getElementById('messagesWrap');
  if (w) setTimeout(() => { w.scrollTop = w.scrollHeight; }, 50);
}

function markRead(id) {
  // Update cache immediately
  const msgs = _msgsCache[id] || [];
  msgs.forEach(m => { if (m.from !== ME.email && !m.read) m.read = true; });
  _msgsCache[id] = msgs;
  // Persist to Firestore (fire-and-forget)
  dbMarkMessagesRead(id, ME.email).catch(() => {});
}

// ─── Send message ─────────────────────────────────────────
async function sendText() {
  const el   = document.getElementById('msgInput');
  const text = el.value.trim();
  if (!text || !ACTIVE_ID) return;
  if (OTHER && isBlockedByMe(OTHER.email)) return;
  const msg = { id: 'm' + Date.now(), from: ME.email, to: OTHER?.email || '', text, ts: Date.now(), read: false };
  await appendMsg(msg);
  el.value = '';
  autoGrow(el);
  notifyOther('💬 ' + (ME.name || ME.email), text.slice(0, 70));
}

async function appendMsg(msg) {
  // Update cache and save message to Firestore
  const msgs = _msgsCache[ACTIVE_ID] || [];
  msgs.push(msg);
  _msgsCache[ACTIVE_ID] = msgs;
  await dbSaveMessage(ACTIVE_ID, msg);

  // Update MY conversation meta
  const conv = _convsCache.find(c => c.id === ACTIVE_ID);
  if (conv) {
    conv.lastMsg  = msg.text || '[media]';
    conv.lastTime = msg.ts;
    await dbSaveConv(ME.email, conv);
  }

  // Ensure OTHER user also has this conversation in THEIR Firestore list
  if (OTHER && OTHER.email) {
    const otherConv = {
      id: ACTIVE_ID,
      otherEmail: ME.email,
      otherName:  ME.name || ME.email,
      lastMsg:    msg.text || '[media]',
      lastTime:   msg.ts
    };
    await dbSaveConv(OTHER.email, otherConv);
  }

  renderMessages();
  renderConvList();
}

async function deleteMsg(msgId) {
  const ok = await customConfirm('Delete this message?', {
    title: 'Delete Message', icon: '🗑️', confirmLabel: 'Delete', danger: true
  });
  if (!ok) return;
  const msgs = _msgsCache[ACTIVE_ID] || [];
  const m = msgs.find(x => x.id === msgId);
  if (m && m.from === ME.email) {
    m.deleted = true; m.text = ''; m.data = '';
    _msgsCache[ACTIVE_ID] = msgs;
    await dbDeleteMessage(ACTIVE_ID, msgId);
    renderMessages();
  }
}

async function deleteConv(convId) {
  if (!convId) return;
  const conv = _convsCache.find(c => c.id === convId);
  const name = conv ? (conv.otherName || conv.otherEmail) : 'this chat';
  const ok = await customConfirm(`Delete your chat with ${name}?\n\nThis only removes it from your list — the other person still has it.`, {
    title: 'Delete Chat', icon: '🗑️', confirmLabel: 'Delete', danger: true
  });
  if (!ok) return;

  // Remove from local cache
  _convsCache = _convsCache.filter(c => c.id !== convId);
  delete _msgsCache[convId];

  // Remove from Firestore (my side only)
  await dbDeleteConv(ME.email, convId).catch(() => {});

  // If we deleted the currently open chat, hide it
  if (ACTIVE_ID === convId) {
    ACTIVE_ID = null;
    document.getElementById('convHeader').classList.remove('show');
    document.getElementById('messagesWrap').style.display = 'none';
    document.getElementById('inputBar').style.display = 'none';
    document.getElementById('chatPlaceholder').style.display = 'flex';
    if (window.innerWidth <= 660) openSidebar();
  }

  renderConvList();
}

function handleKey(ev) {
  if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); sendText(); }
}
function autoGrow(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 110) + 'px'; }

// ─── File handling ────────────────────────────────────────
let fileAccept = '*';
function toggleAttachMenu() { document.getElementById('attachMenu').classList.toggle('show'); }
function pickFile(accept) {
  fileAccept = accept;
  const fi = document.getElementById('fileInput');
  fi.accept = accept;
  fi.click();
  document.getElementById('attachMenu').classList.remove('show');
}
function handleFileInput(input) {
  const file = input.files[0];
  if (!file || !ACTIVE_ID) return;
  if (OTHER && isBlockedByMe(OTHER.email)) { input.value = ''; return; }
  const isImg = file.type.startsWith('image/');
  const isVid = file.type.startsWith('video/');
  const type  = isImg ? 'image' : isVid ? 'video' : 'file';
  const size  = file.size > 1024 * 1024
    ? (file.size / 1024 / 1024).toFixed(1) + ' MB'
    : (file.size / 1024).toFixed(0) + ' KB';
  const reader = new FileReader();
  reader.onload = async ev => {
    const msg = { id: 'm' + Date.now(), from: ME.email, to: OTHER?.email || '', type, data: ev.target.result, fileName: file.name, fileSize: size, ts: Date.now(), read: false };
    await appendMsg(msg);
    const label = isImg ? '🖼 Sent an image' : isVid ? '🎬 Sent a video' : '📎 Sent: ' + file.name;
    notifyOther(ME.name || ME.email, label);
  };
  reader.readAsDataURL(file);
  input.value = '';
}
function dl(data, name) { const a = document.createElement('a'); a.href = data; a.download = name; a.click(); }
function lightbox(src) {
  const w = window.open('', '_blank');
  if (!w) return;
  w.document.write(`<!DOCTYPE html>
<html>
<head><title>Image Preview</title></head>
<body style="margin:0;background:#000;display:flex;align-items:center;justify-content:center;min-height:100vh">
  <img src="${encodeURI(src)}" alt="preview" style="max-width:100%;max-height:100vh">
</body>
</html>`);
  w.document.close();
}
/* PWA keyboard fix using visualViewport.
   Keeps input bar visible when mobile keyboard opens. */
(function setupKeyboardViewportFix() {
  if (!window.visualViewport) return;
  function onResize() {
    const vv   = window.visualViewport;
    const keyH = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    const bar  = document.getElementById('inputBar');
    const wrap = document.getElementById('messagesWrap');
    if (!bar) return;
    if (keyH > 50) {
      bar.style.transform  = 'translateY(-' + keyH + 'px)';
      bar.style.transition = 'transform .12s ease';
      if (wrap) {
        wrap.style.paddingBottom = (keyH + 10) + 'px';
        wrap.scrollTop = wrap.scrollHeight;
      }
    } else {
      bar.style.transform = '';
      if (wrap) wrap.style.paddingBottom = '10px';
    }
  }
  window.visualViewport.addEventListener('resize', onResize);
  window.visualViewport.addEventListener('scroll', onResize);
})();
// ─── Mute ─────────────────────────────────────────────────
async function toggleMute() {
  const m = [..._mutedCache];
  const i = m.indexOf(ACTIVE_ID);
  if (i === -1) m.push(ACTIVE_ID); else m.splice(i, 1);
  await setMuted(m);
  updateMuteBtn();
  updateProfPanel();
  renderConvList();
}
function updateMuteBtn() {
  const muted = isMuted(ACTIVE_ID);
  const btn   = document.getElementById('muteBtn');
  const ppBtn = document.getElementById('ppMuteBtn');
  if (btn)   { btn.textContent = muted ? '🔕' : '🔔'; btn.title = muted ? 'Unmute' : 'Mute'; btn.classList.toggle('muted-btn', muted); }
  if (ppBtn) { ppBtn.textContent = muted ? '🔔 Unmute Conversation' : '🔕 Mute Conversation'; }
}

// ─── Profile panel ────────────────────────────────────────
function toggleProfPanel() {
  document.getElementById('profPanel').classList.toggle('open');
}
function updateProfPanel() {
  if (!OTHER) return;
  const init = initials(OTHER.name || OTHER.email);
  document.getElementById('ppAvatar').textContent = init;
  document.getElementById('ppName').textContent   = OTHER.name || OTHER.email;
  const yearLabels = { '1':'Year 1','2':'Year 2','3':'Year 3','4':'Year 4','5':'Year 5', intern:'Internship' };
  document.getElementById('ppRole').textContent   = '🎓 COLLEGE STUDENT' + (OTHER.profile?.university ? ' · ' + OTHER.profile.university : '');
  let det = '';
  if (OTHER.profile?.university) det += `<div class="pp-row"><strong>University</strong><span>${e(OTHER.profile.university)}</span></div>`;
  if (OTHER.profile?.yearStudy)  det += `<div class="pp-row"><strong>Year</strong><span>${e(yearLabels[OTHER.profile.yearStudy] || OTHER.profile.yearStudy)}</span></div>`;
  if (OTHER.profile?.bio)      det += `<div class="pp-row"><strong>About</strong><span>${e(OTHER.profile.bio.slice(0, 100))}</span></div>`;
  det += `<div class="pp-row"><strong>Email</strong><span>${e(OTHER.email)}</span></div>`;
  if (OTHER.profile?.phone)    det += `<div class="pp-row"><strong>📞 Phone</strong><span><a href="tel:${e(OTHER.profile.phone)}" style="color:var(--forest);text-decoration:none;">${e(OTHER.profile.phone)}</a></span></div>`;
  document.getElementById('ppDetails').innerHTML = det;
  updateMuteBtn();
}

// ─── Notifications ────────────────────────────────────────
async function notifyOther(from, body) {
  if (!OTHER || !ACTIVE_ID) return;
  // Check if other user has this chat muted (read from Firestore)
  const theirMuted = await dbGetMuted(OTHER.email).catch(() => []);
  if (theirMuted.includes(ACTIVE_ID)) return;
  const notif = { id: 'n' + Date.now(), type: 'chat', title: 'Message from ' + from, body, ts: Date.now(), read: false };
  await dbPushNotif(OTHER.email, notif);
}

function updateNotifBadge() {
  const n = _notifsCache.filter(x => !x.read).length;
  const b = document.getElementById('notifBadge');
  if (n > 0) { b.textContent = n; b.style.display = 'block'; } else { b.style.display = 'none'; }
}

async function openNotifs() {
  _notifsCache.forEach(n => n.read = true);
  await dbMarkNotifsRead(ME.email).catch(() => {});
  updateNotifBadge();

  // Build notification popup
  const panel = document.getElementById('notifPopup');
  const list  = document.getElementById('notifPopupList');
  const items = _notifsCache.slice(0, 10);
  if (!items.length) {
    list.innerHTML = '<div style="text-align:center;color:rgba(90,122,98,.5);padding:24px 0;font-size:13px;">🔔 No notifications yet</div>';
  } else {
    list.innerHTML = items.map(n => `
      <div class="np-item" data-id="${n.id}">
        <div class="np-title">${e(n.title)}</div>
        <div class="np-body">${e(n.body)}</div>
        <button class="np-del" onclick="dismissNotif('${n.id}')">✕</button>
      </div>`).join('');
  }
  panel.classList.add('show');
}

async function dismissNotif(id) {
  // Remove from local cache immediately (instant UI)
  _notifsCache = _notifsCache.filter(n => n.id !== id);
  // Remove the DOM element instantly
  const el = document.querySelector(`.np-item[data-id="${id}"]`);
  if (el) el.style.opacity = '0.3';
  // Delete permanently from Firestore
  await dbDeleteNotif(ME.email, id).catch(() => {});
  if (el) el.remove();
  // Update list
  const list = document.getElementById('notifPopupList');
  if (!_notifsCache.length) {
    list.innerHTML = '<div style="text-align:center;color:rgba(90,122,98,.5);padding:24px 0;font-size:13px;">🔔 No notifications yet</div>';
    setTimeout(() => document.getElementById('notifPopup').classList.remove('show'), 1200);
  }
  updateNotifBadge();
}

function closeNotifPopup() {
  document.getElementById('notifPopup').classList.remove('show');
}


// ─── Mobile sidebar ───────────────────────────────────────
function openSidebar()  { document.getElementById('sidebar').classList.add('open'); document.getElementById('sbOverlay').classList.add('show'); document.getElementById('sbCloseBtn').style.display = 'block'; }
function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('sbOverlay').classList.remove('show'); document.getElementById('sbCloseBtn').style.display = 'none'; }

// ─── Helpers ─────────────────────────────────────────────
function initials(name) { return (name || '?').split(/\s+/).map(w => w[0]).join('').toUpperCase().slice(0, 2); }
function e(s)  { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function e2(s) { return e(s).replace(/\n/g, '<br>'); }
function linkify(html) {
  return html.replace(/(https?:\/\/[^\s<]+)/g, url => `<a href="${url}" target="_blank" rel="noopener">${url}</a>`);
}
function goHome() { window.location.href = (typeof dashboardUrlForRole === 'function') ? dashboardUrlForRole(ME?.role) : (ME?.role === 'doctor' ? 'choose-year.html' : 'choose-role.html'); }

// ─── Load all data from Firestore into caches ────────────
async function loadAllFromFirestore() {
  // Reset all caches before loading — prevents cross-account data leakage
  _convsCache  = [];
  _mutedCache  = [];
  _blockedCache = [];
  _notifsCache = [];
  _msgsCache   = {};

  [_convsCache, _mutedCache, _blockedCache, _notifsCache] = await Promise.all([
    dbGetConvs(ME.email).catch(() => []),
    dbGetMuted(ME.email).catch(() => []),
    dbGetBlocked(ME.email).catch(() => []),
    dbGetNotifs(ME.email).catch(() => []),
  ]);
  _seenNotifIds = new Set(_notifsCache.map(n => n.id));

  // Safety: only keep conversations that include ME's email in the chatId
  _convsCache = _convsCache.filter(c => c.id && c.id.includes(ME.email));

  // Pre-load messages for each conversation
  for (const conv of _convsCache) {
    _msgsCache[conv.id] = await dbGetMessages(conv.id, ME.email).catch(() => []);
  }
}

// ─── Poll Firestore for new messages and convs ───────────
async function pollFirestore() {
  // Refresh convs list
  _convsCache = await dbGetConvs(ME.email).catch(() => _convsCache);
  // Refresh messages for active conversation
  if (ACTIVE_ID) {
    _msgsCache[ACTIVE_ID] = await dbGetMessages(ACTIVE_ID, ME.email).catch(() => _msgsCache[ACTIVE_ID] || []);
    renderMessages();
    markRead(ACTIVE_ID);
    updateBlockUI();
  }
  // Refresh all conv message caches for unread counts
  for (const conv of _convsCache) {
    if (conv.id !== ACTIVE_ID) {
      _msgsCache[conv.id] = await dbGetMessages(conv.id, ME.email).catch(() => _msgsCache[conv.id] || []);
    }
  }
  // Refresh notifications
  const prevNotifIds = new Set(_notifsCache.map(n => n.id));
  _notifsCache = await dbGetNotifs(ME.email).catch(() => _notifsCache);
  // Show browser notifications only for truly new incoming items
  if (window.Notification && Notification.permission === 'granted') {
    _notifsCache
      .filter(n => !prevNotifIds.has(n.id) && !_seenNotifIds.has(n.id))
      .forEach(n => {
        _seenNotifIds.add(n.id);
        new Notification(`Physio Motion — ${n.title || 'New message'}`, {
          body: n.body || '',
          icon: 'icons/icon-192.png'
        });
      });
  } else {
    _notifsCache.forEach(n => _seenNotifIds.add(n.id));
  }
  renderConvList();
  updateNotifBadge();
}

// ─── Init ─────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', async () => {
  ME = requireAuth('student');
  if (!ME) return;

  // Request notification permission
  if (window.Notification && Notification.permission === 'default') Notification.requestPermission();

  // Load all data from Firestore
  await loadAllFromFirestore();

  // Handle URL params — open chat with specific user
  const params    = new URLSearchParams(location.search);
  const withEmail = params.get('with');
  const withName  = params.get('name') || withEmail;
  const preMsg    = params.get('premsg');

  if (withEmail) {
    await ensureConv(withEmail, withName);
    await openConv(chatId(ME.email, withEmail), withEmail, withName);
    if (preMsg) {
      const el = document.getElementById('msgInput');
      el.value = preMsg;
      autoGrow(el);
    }
  }

  renderConvList();
  updateNotifBadge();

  // On mobile, auto-open sidebar so user sees their conversations right away
  if (!withEmail && window.innerWidth <= 660) {
    openSidebar();
  }

  // Poll Firestore every 4s for real-time updates
  POLL = setInterval(pollFirestore, 4000);
});
