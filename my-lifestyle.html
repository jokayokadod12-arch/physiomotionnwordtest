    .mm-box { background:rgba(250,247,242,.5); border:1px solid rgba(90,122,98,.1); border-radius:8px; padding:10px; text-align:center; }
    .mm-val { font-family:'Playfair Display',monospace; font-size:15px; font-weight:700; color:#7A9E82; }
    .mm-lbl { font-size:10px; color:var(--muted); letter-spacing:1px; text-transform:uppercase; margin-top:2px; }

    /* Expanded content */
    .plan-body { display:none; padding:16px 20px 20px; }
    .plan-body.open { display:block; }

    .meal-day { background:rgba(250,247,242,.5); border:1px solid rgba(90,122,98,.08); border-radius:10px; margin-bottom:10px; overflow:hidden; }
    .mday-head { background:rgba(45,74,53,.12); padding:9px 14px; display:flex; justify-content:space-between; }
    .mday-title { font-family:'Playfair Display',monospace; font-size:10px; color:#7A9E82; letter-spacing:1.5px; }
    .mday-cals  { font-size:11px; color:var(--charcoal-mid); }
    .meal-row { display:grid; grid-template-columns:90px 1fr auto; gap:8px; padding:8px 14px; border-bottom:1px solid rgba(90,122,98,.04); font-size:13px; align-items:start; }
    .meal-row:last-child { border-bottom:none; }
    .meal-type { font-size:10px; font-weight:700; color:rgba(90,122,98,.6); text-transform:uppercase; letter-spacing:.8px; padding-top:2px; }
    .meal-items { color:#2C2C2C; line-height:1.5; }
    .meal-cals  { font-family:'Playfair Display',monospace; font-size:11px; color:#7A9E82; white-space:nowrap; padding-top:2px; }
    @media(max-width:480px){ .meal-row{ grid-template-columns:70px 1fr; } .meal-cals{ display:none; } }

    .tips-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:14px; }
    @media(max-width:560px){ .tips-grid{ grid-template-columns:1fr; } }
    .tip-card { background:rgba(250,247,242,.4); border:1px solid rgba(90,122,98,.08); border-radius:8px; padding:10px 12px; }
    .tip-title { font-size:12px; font-weight:700; color:#7A9E82; margin-bottom:4px; }
    .tip-txt   { font-size:12px; color:var(--charcoal-mid); line-height:1.6; }

    .empty-state { text-align:center; padding:60px 20px; color:var(--muted); }
    .empty-state span { font-size:56px; display:block; margin-bottom:14px; }
    .empty-state p { font-size:14px; line-height:1.8; }

<script>
(function(){
  const pageKey = 'physio_mute_page_my-lifestyle.html'.replace('.html','');
  const user = JSON.parse(localStorage.getItem('currentUser')||'null');
  if(!user) return;
  const muteKey = 'physio_page_muted_'+user.email;
  const muted = JSON.parse(localStorage.getItem(muteKey)||'[]');
  const btn = document.getElementById('mutePageBtn');
  if(btn){ btn.textContent = muted.includes(pageKey)?'🔕':'🔔'; btn.title = muted.includes(pageKey)?'Unmute notifications':'Mute notifications'; }
  window.togglePageMute = function(){
    const m2 = JSON.parse(localStorage.getItem(muteKey)||'[]');
    const i = m2.indexOf(pageKey);
    if(i===-1) m2.push(pageKey); else m2.splice(i,1);
    localStorage.setItem(muteKey,JSON.stringify(m2));
    if(btn){ btn.textContent=m2.includes(pageKey)?'🔕':'🔔'; btn.title=m2.includes(pageKey)?'Unmute notifications':'Mute notifications'; }
  };
})();
</script>

<script>
let currentUser = null;

document.addEventListener('DOMContentLoaded', async () => {
  currentUser = requireAuth('patient');
  if (!currentUser) return;

  // Try Firebase with timeout — fallback to localStorage data
  if (window.FIREBASE_ENABLED) {
    try {
      const fresh = await Promise.race([
        fbGetUser(currentUser.email),
        new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 5000))
      ]);
      if (fresh) { currentUser = fresh; updateCurrentUser(fresh); }
    } catch (e) {
      console.warn('Firebase fetch skipped, using cached data:', e.message);
      // currentUser already has localStorage data — proceed
    }
  }
  render();
});

function render() {
  const plans = currentUser.lifestylePlans || [];
  const container = document.getElementById('plansContainer');

  if (!plans.length) {
    container.innerHTML = `
      <div class="empty-state">
        <span>🥗</span>
        <p>No nutrition plans yet.<br>Your doctor will send you a personalized plan.</p>
      </div>`;
    return;
  }

  const sorted = [...plans].sort((a,b) => (b.id||0)-(a.id||0));
  container.innerHTML = sorted.map((p, idx) => {
    const realIdx = plans.findIndex(x => x.id === p.id);
    const goalLabel = p.goal==='lose'?'📉 Weight Loss': p.goal==='gain'?'📈 Weight Gain':'⚖️ Maintain';
    const diseases = (p.diseases||[]).filter(d => d !== 'none').join(', ') || 'No conditions';

    return `
      <div class="plan-card" id="planCard-${p.id}">
        <div class="plan-head">
          <div class="plan-head-info">
            <h3>🥗 Nutrition Plan — ${esc(p.patientName||currentUser.name)}</h3>
            <p>👨‍⚕️ Dr. ${esc(p.doctorName||'Unknown')} &nbsp;·&nbsp; ${esc(p.date||'')} &nbsp;·&nbsp; ${goalLabel}</p>
            <p style="margin-top:3px;">${esc(diseases)}</p>
          </div>
          <div class="plan-head-actions">
            <button class="btn-sm btn-expand" onclick="togglePlan(${p.id})">👁 View</button>
            <button class="btn-sm btn-print"  onclick="printPlan(${realIdx})">📄 Word</button>
            <button class="btn-sm btn-delete" onclick="deletePlan(${realIdx})">🗑 Delete</button>
          </div>
        </div>

        <!-- Mini metrics -->
        <div class="metrics-mini">
          <div class="mm-box"><div class="mm-val">${p.target||'—'} kcal</div><div class="mm-lbl">Daily Target</div></div>
          <div class="mm-box"><div class="mm-val">${p.bmr||'—'} kcal</div><div class="mm-lbl">BMR</div></div>
          <div class="mm-box"><div class="mm-val">${p.bmi||'—'}</div><div class="mm-lbl">BMI (${esc(p.bmiCat||'')})</div></div>
          <div class="mm-box"><div class="mm-val">${p.macros?.protein||'—'}g</div><div class="mm-lbl">Protein/day</div></div>
          <div class="mm-box"><div class="mm-val">${p.macros?.carbs||'—'}g</div><div class="mm-lbl">Carbs/day</div></div>
          <div class="mm-box"><div class="mm-val">${p.macros?.fat||'—'}g</div><div class="mm-lbl">Fat/day</div></div>
        </div>

        <!-- Expandable meal plan -->
        <div class="plan-body" id="planBody-${p.id}">
          <div style="font-family:'Playfair Display',monospace;font-size:11px;color:#7A9E82;letter-spacing:2px;margin-bottom:12px;">🍽️ 7-DAY MEAL PLAN</div>
          ${(p.meals||[]).map(d => `
            <div class="meal-day">
              <div class="mday-head">
                <div class="mday-title">${d.day}</div>
                <div class="mday-cals">${d.totalCals} kcal</div>
              </div>
              ${d.meals.map(m => `
                <div class="meal-row">
                  <div class="meal-type">${m.type}</div>
                  <div class="meal-items">${m.items}</div>
                  <div class="meal-cals">${m.cals} kcal</div>
                </div>`).join('')}
            </div>`).join('')}

          <div style="font-family:'Playfair Display',monospace;font-size:11px;color:#7A9E82;letter-spacing:2px;margin:14px 0 10px;">💡 LIFESTYLE TIPS</div>
          <div class="tips-grid">
            ${(p.tips||[]).map(t => `
              <div class="tip-card">
                <div class="tip-title">${t.title}</div>
                <div class="tip-txt">${t.txt}</div>
              </div>`).join('')}
          </div>
        </div>
      </div>`;
  }).join('');
}

function togglePlan(id) {
  const body = document.getElementById(`planBody-${id}`);
  const btn  = body.previousElementSibling?.previousElementSibling?.querySelector('.btn-expand');
  if (!body) return;
  body.classList.toggle('open');
  if (btn) btn.textContent = body.classList.contains('open') ? '▲ Hide' : '👁 View';
}

async function deletePlan(idx) {
  const ok = await customConfirm('Delete this nutrition plan from your records?', {
    title: 'Delete Plan', icon: '🗑️', confirmLabel: 'Delete', danger: true
  });
  if (!ok) return;
  currentUser.lifestylePlans = (currentUser.lifestylePlans||[]).filter((_,i) => i !== idx);
  await asyncSaveUser(currentUser).catch(() => {});
  updateCurrentUser(currentUser);
  render();
}

function printPlan(idx) {
  const p = (currentUser.lifestylePlans||[])[idx];
  if (!p) return;
  downloadPlanWord(p, (window.event||{}).currentTarget || null);
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
</script>
